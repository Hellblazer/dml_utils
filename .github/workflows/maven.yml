name: Maven Build

on:
  pull_request:
    branches:
      - main

concurrency:
  group: maven-${{ github.ref }}
  cancel-in-progress: true

# `packages: read` lets the reusable Maven workflow's GITHUB_TOKEN fetch the
# liquibase-validation artifact from GitHub Packages.
permissions:
  contents: read
  packages: read

jobs:
  # The Maven entry points' retry/exit/diagnostics behaviour is shell-level, so
  # it is covered by a stubbed-Maven test instead of the reactor build.
  shell-tests:
    name: Shell script tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Maven retry scripts
        run: bash .github/scripts/maven-retry-test.sh

  build:
    # Pinned to the workflow_library commit; bump the SHA deliberately when
    # upgrading the library. Keep it in step with the scripts/ submodule.
    uses: eyupmiduck/workflow_library/.github/workflows/maven.yml@593fcd4bd1fe5a5cb9921360d7365747fc249b62
    with:
      java-version: "25"
      # 19 is a release candidate until its scheduled GA on 2026-11-19; the
      # tag is explicit so the leg tests that pre-release (currently rc2;
      # 19-alpine does not exist until GA).
      postgres-versions: '["postgres:16-alpine","postgres:17-alpine","postgres:18-alpine","postgres:19rc2-alpine"]'
      project: dml_utils
      # Retries once on the known jOOQ-codegen/PostgreSQL startup race; see
      # .github/scripts/maven-verify-retry.sh.
      maven-command: ./.github/scripts/maven-verify-retry.sh
