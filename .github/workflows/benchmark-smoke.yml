name: Benchmark smoke

# The benchmark is not covered by the Maven build: it drives the routines
# through the benchmark fixtures, which live outside the Liquibase-managed
# schemas and are owned by the container superuser. This smoke test creates a
# tiny isolated benchmark database, runs one measured run per chunking strategy,
# and removes it again, so a changelog or benchmark change cannot silently break
# the harness (for example the boundary scan losing access to the fixture schema).
#
# It runs only when the benchmark, a changelog or the build files change, so the
# extra custom-image build does not run on unrelated pull requests.

on:
  pull_request:
    paths:
      - "benchmark/**"
      - "dml_utils/src/main/resources/db/changelog/**"
      - "pom.xml"
      - "dml_utils/pom.xml"
      - "scripts"
      - "scripts/**"
      - ".gitmodules"
      - ".github/scripts/settings.xml"
      - ".github/workflows/benchmark-smoke.yml"
  push:
    branches:
      - main
    paths:
      - "benchmark/**"
      - "dml_utils/src/main/resources/db/changelog/**"
      - "pom.xml"
      - "dml_utils/pom.xml"
      - "scripts"
      - "scripts/**"
      - ".gitmodules"
      - ".github/scripts/settings.xml"
      - ".github/workflows/benchmark-smoke.yml"
  workflow_dispatch:

concurrency:
  group: benchmark-smoke-${{ github.ref }}
  cancel-in-progress: true

# `packages: read` lets Maven fetch the liquibase-validation and ddl_utils
# artifacts from GitHub Packages when setup.sh unpacks the ddl_utils changelog.
permissions:
  contents: read
  packages: read

jobs:
  smoke:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # The job executes PR-head code (benchmark/smoke.sh, ./mvnw) with a
    # GITHUB_TOKEN that can read GitHub Packages. A fork PR must not receive
    # that token; run the smoke only for same-repository PRs (whose authors can
    # already push code), pushes to main and manual dispatches after review.
    # Keep the Maven Build workflow's fork coverage separate.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The custom image build lives in the workflow_library submodule
          # mounted at scripts/.
          submodules: true
          # Do not leave the job token in .git/config for the PR code to read.
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          # Writes the ~/.m2/settings.xml server entry `github`; the values are
          # environment variable names, so GITHUB_TOKEN must be exported to the
          # Maven steps.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build custom PostgreSQL image
        env:
          PROJECT: dml_utils
        run: scripts/build-postgres-image.sh postgres:17-alpine

      - name: Unpack the ddl_utils changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          ./mvnw -s .github/scripts/settings.xml --batch-mode
          --no-transfer-progress -q -pl dml_utils -am initialize

      - name: Run the benchmark smoke test
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # setup.sh re-runs ./mvnw initialize, and Maven's launcher (3.9+)
          # reads MAVEN_ARGS, so the wrapper's child Maven gets both Packages
          # server entries (github and github-ddl-utils) without setup.sh
          # hard-coding the settings path.
          MAVEN_ARGS: -s .github/scripts/settings.xml
        run: benchmark/smoke.sh
